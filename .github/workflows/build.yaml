name: Build signed IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: IPA 签名方式
        required: true
        default: release-testing
        type: choice
        options:
          - release-testing
          - debugging

permissions:
  contents: read

concurrency:
  group: signed-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Archive and export
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      EXPORT_METHOD: ${{ inputs.export_method }}
      BUNDLE_ID: com.xiaoke.salesworkspace

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_TEAM_ID \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            BUILD_PROVISION_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "缺少 GitHub Actions Secrets: ${missing[*]}" >&2
            exit 1
          fi

          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID 格式不正确。" >&2
            exit 1
          fi

      - name: Show Xcode project information
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project ios/NiuMa/NiuMa.xcodeproj

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/NiuMa/NiuMa.xcodeproj \
            -scheme NiuMa \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Install signing certificate and profile
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/build-certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          profile_path="$RUNNER_TEMP/build.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_bundle_id="${profile_app_id#*.}"

          if [[ ! "$profile_uuid" =~ ^[A-Fa-f0-9-]+$ ]]; then
            echo "描述文件 UUID 格式不正确。" >&2
            exit 1
          fi

          if [[ "$profile_team_id" != "$APPLE_TEAM_ID" ]]; then
            echo "描述文件 Team ID 与 APPLE_TEAM_ID 不匹配。" >&2
            exit 1
          fi

          if [[ "$profile_bundle_id" != "$BUNDLE_ID" && "$profile_bundle_id" != "*" ]]; then
            echo "描述文件 Bundle ID ($profile_bundle_id) 与工程 ($BUNDLE_ID) 不匹配。" >&2
            exit 1
          fi

          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile"

          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "installed_profile=$installed_profile" >> "$GITHUB_OUTPUT"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build signed IPA
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/output" \
            ios/NiuMa/scripts/export-ipa.sh \
              "$APPLE_TEAM_ID" \
              "$EXPORT_METHOD" \
              "${{ steps.signing.outputs.profile_uuid }}"

          ipa_count="$(find "$RUNNER_TEMP/output/ipa" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          if [[ "$ipa_count" != "1" ]]; then
            echo "预期生成 1 个 IPA，实际为 $ipa_count。" >&2
            exit 1
          fi

          shasum -a 256 "$RUNNER_TEMP"/output/ipa/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NiuMa-${{ inputs.export_method }}-${{ github.run_number }}
          path: ${{ runner.temp }}/output/ipa/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/build-certificate.p12" \
            "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/build.mobileprovision" \
            "${{ steps.signing.outputs.installed_profile }}"
